name: publish-npm

# 打 tag（如 v1.0.0）时自动发 npm；需要在仓库 Settings → Secrets 里配置 NPM_TOKEN。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          node -e "const v=require('./package.json').version; const t=process.env.GITHUB_REF_NAME.replace(/^v/,''); if(v!==t){console.error('tag',t,'!= package.json',v);process.exit(1)}"
      - name: Publish
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
